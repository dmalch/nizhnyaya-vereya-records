# Настройки селения для verso — только то, что читают команды этого репозитория.
schema = 1

[census]
# Где транслятор датирует рождение по возрасту прошлой ревизии иначе, чем цепь ревизий
# библиотеки (geni.census_revisions): заморожено применённым деревом. РС-10 1857 не датируется
# по 1850: иначе 17 живых оценок рождения сменятся с «1857 − возраст» на «1850 − прошлый возраст».
prev_revision = { 1857 = false }
